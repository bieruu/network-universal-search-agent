# Fly.io configuration for the FastAPI backend.
#
# Deploy from INSIDE this directory:
#
#     cd backend && fly deploy
#
# That location is not cosmetic. Fly's `[build] dockerfile` does NOT change the
# Docker build context -- the context is the directory the deploy runs from.
# The Dockerfile copies `requirements.txt`, `alembic.ini` and `alembic/`, which
# exist only here, so a `fly deploy` from the repository root would fail with
# "COPY failed: file not found in build context". Keeping fly.toml beside the
# Dockerfile is what makes one Dockerfile serve both this host and Render.
#
# Region `nrt` is Tokyo, matching the Supabase project in ap-northeast-1.
# Fly's `sin` would be the second-best choice; the point is to avoid a
# cross-region hop on every query.

app = "osint-api"
primary_region = "nrt"

# uvicorn handles SIGTERM and drains in-flight requests; give a running scan
# half a minute instead of the 5s default. These are TOP-LEVEL keys -- in TOML
# anything placed after a table header belongs to that table, so putting them
# at the bottom of this file would silently register them as `[vm]` settings.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

# Non-sensitive only. Everything secret is `fly secrets set` -- see WORKFLOW.md
# 8.6. DATABASE_URL deliberately lives in secrets even though it is "just" a
# URL: it carries the database password.
[env]
  APP_ENV = "production"
  CACHE_BACKEND = "postgres"
  RATE_LIMIT_PER_HOUR = "5"
  RATE_LIMIT_DAILY_TOTAL = "50"

[http_service]
  # The Dockerfile CMD binds to $PORT, which Fly sets to 8080.
  internal_port = 8080
  force_https = true
  # Always on. The operator asked for a backend that does not depend on their
  # own machine, and stopping it would not save much anyway: a stopped Machine
  # is still billed for its root filesystem, and a Machine woken by the next
  # request spends its cold start inside the 60s the Vercel proxy allows for a
  # scan (WORKFLOW.md 8.2) -- which is how a scan turns into an edge 504.
  auto_stop_machines = "off"
  auto_start_machines = true
  [http_service.concurrency]
    # "requests", not the "connections" default: this is an HTTP API and Fly
    # can pool and reuse connections for load balancing.
    type = "requests"
    soft_limit = 20
    hard_limit = 25

[[http_service.checks]]
  # /health, not /ready: /ready opens a database connection on every probe.
  # 30s of grace because the CMD runs `alembic upgrade head` before uvicorn.
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[vm]
  size = "shared-cpu-1x"
  memory = "512mb"