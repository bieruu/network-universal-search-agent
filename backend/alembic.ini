[alembic]
script_location = alembic
sqlalchemy.url =
# Put this directory on sys.path so `alembic <command>` (the console script, as
# CI and the README invoke it) can import `app`. `python -m alembic` works
# without it only because running a module puts the CWD on sys.path — which is
# why the container CMD passed while every other invocation failed with
# `ModuleNotFoundError: No module named 'app'`.
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[loggers_root]
level = WARN
handlers = console
